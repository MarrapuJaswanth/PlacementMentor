<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlacementMentor</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="wrap"><header><h1>PlacementMentor</h1><p>AI Placement Preparation Coach</p></header>
<div class="grid"><aside><h2>Student Profile</h2>
<label>Name<input id="name" value="Student"></label>
<label>Branch<input id="branch" value="CSE"></label>
<label>Year<input id="year" value="Final Year"></label>
<label>Target Role<input id="role" value="Software Developer"></label>
<label>Languages<input id="langs" value="Python, Java"></label>
<label>Technologies<input id="tech" placeholder="SQL, React, Git"></label>
<label>Preparation Days<input id="days" type="number" value="30"></label>
<button onclick="roadmap()">Generate Roadmap</button></aside>
<main><div id="chat"></div><div class="quick">
<button onclick="ask('Analyze my target role: responsibilities, technologies and important concepts.')">Role Analysis</button>
<button onclick="ask('Give me DSA topics for placements ranked High, Medium and Low.')">DSA</button>
<button onclick="ask('Prepare me for technical and HR interviews.')">Interview Prep</button>
<button onclick="ask('Start a mock interview. Ask one question at a time.')">Mock Interview</button>
</div><div class="send"><textarea id="msg" placeholder="Ask anything about placements..."></textarea><button onclick="send()">Send</button></div></main></div></div>
<script src="/static/app.js"></script></body></html>
